name: Validate BEKIUZ BUILD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app and AI function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies for AI Gateway and function type checks
        run: npm install --no-audit --no-fund

      - name: Check browser JavaScript syntax
        run: node --check --input-type=module < app.js

      - name: Validate web app manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('Manifest JSON is valid')"

      - name: Validate Netlify AI function TypeScript
        run: npx --yes --package typescript tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --skipLibCheck netlify/functions/ai-plan.mts

      - name: Build public site without function source
        run: node scripts/build.mjs

      - name: Verify build output and keep function private
        run: test -f dist/index.html && test -f dist/app.js && test ! -e dist/netlify/functions/ai-plan.mts
